FKB = 2.0
FRA = 2.0
MUC = 3.0
CGN = 3.0
HHN = 4.0
LHR = 1.0
LGW = 1.0
STN = 2.0
LTN = 2.0
CDG = 1.5
ORY = 1.0
BVA = 2.0
MAD = 1.0
BCN = 1.0
FCO = 1.5
CIA = 1.0

