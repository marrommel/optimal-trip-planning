[hotel_defaults]
CHECK_IN_HOUR = 14.0               # Used only when the cached hotel quote has no check-in time
CHECK_OUT_HOUR = 12.0              # Used only when the cached hotel quote has no check-out time
HOTEL_REQUEST_DELAY_SECONDS = 1.0  # Pause between city/night requests on cache misses
ALLOW_SYNTHETIC_HOTELS = false     # remove this setting

[timing_allowances]                # Allowances, NOT verified transfers or quoted fares. Costs are excluded.
FLIGHT_CHECK_IN_HOURS = 2.0
FLIGHT_EXIT_HOURS = 1.0
STATION_ACCESS_HOURS = 0.5
STATION_EXIT_HOURS = 0.5

[AIRPORT_ACCESS_HOURS]             # Hours from the city/home to each airport
